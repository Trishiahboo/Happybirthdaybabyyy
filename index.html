<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🤍</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    font-family:Georgia, serif;
}

.container{
    animation:fade 2s;
    padding:20px;
}

.rose{
    font-size:70px;
    animation:float 3s infinite ease-in-out;
}

h1{
    font-size:48px;
    margin:20px 0;
}

#typing{
    font-size:22px;
    color:#d7d7d7;
    min-height:70px;
}

button{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:white;
    color:black;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

@keyframes fade{
from{opacity:0;}
to{opacity:1;}
}
    
.before{
    color:#cfcfcf;
    font-size:18px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:25px;
}

button{
    background:transparent;
    color:white;
    border:1px solid white;
    padding:15px 35px;
    border-radius:40px;
    font-size:18px;
    cursor:pointer;
    transition:.4s;
}

button:hover{
    background:white;
    color:black;
    transform:scale(1.05);
}

.rose{
    font-size:80px;
    filter:drop-shadow(0 0 18px #ffffff55);
}

</style>

</head>

<body>

<div class="container">

<div class="rose">🌹</div>

<p class="before">Before you continue...</p>

<h1>Happy Birthday, Jim.</h1>

<p id="typing"></p>

<button onclick="startStory()">
Continue →
</button>

</div>

<script>
const text =
"This isn't just another birthday message... It's something made just for you. 🤍";

let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
    }
}

typeWriter();

function startStory() {
    alert("🌹 The story begins here... (Next we'll make this button open your cinematic letter instead of an alert!)");
}
</script>

</body>
</html>
